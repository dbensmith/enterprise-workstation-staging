title = "enterprise-workstation-staging"

# Start from gitleaks' maintained default rule set. No allow mechanism of any kind is used: every
# gitleaks call in Test-Kit.ps1 also passes --ignore-gitleaks-allow, so inline markers do not work.
[extend]
useDefault = true

# Third-party installer link or MSI properties (RMM agents and similar) carrying a real value. The
# committed example config keeps these values empty (''), which this rule does not match, so no
# exception is needed.
[[rules]]
id = "installer-account-value"
description = "Third-party installer link or MSI property carrying a real account, customer or token value"
regex = '''(?i)(?:accountId|IntegratorLogin|customerId|installToken|enrollmentToken)\s*[=:]\s*['"]?([A-Za-z0-9%@._-]{6,})'''
secretGroup = 1
keywords = ["accountid", "integratorlogin", "customerid", "installtoken", "enrollmenttoken"]
